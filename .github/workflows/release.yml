name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Aroxy Release
        run: cargo build --release --bin aroxy

      - name: Package AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./packaging/linux/build_appimage.sh
          ./appimagetool target/AppDir Aroxy-x86_64.AppImage || true

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aroxy-Linux
          path: |
            target/release/aroxy
            *.AppImage

  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Aroxy Portable EXE
        run: cargo build --release --bin aroxy

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aroxy-Windows-x64
          path: target/release/aroxy.exe
