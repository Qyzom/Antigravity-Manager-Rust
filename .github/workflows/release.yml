name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build AMR Release
        run: cargo build --release --bin amr

      - name: Package AppImage, DEB and RPM
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}"
          echo "Packaging Linux releases for version $VERSION"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ./packaging/linux/build_appimage.sh "$VERSION" "x86_64"
          ARCH=x86_64 ./squashfs-root/AppRun --no-appstream target/AppDir "AMR-${VERSION}-x86_64.AppImage"
          ./packaging/linux/build_deb.sh "$VERSION" "amd64"
          cargo install cargo-generate-rpm --locked
          cargo-generate-rpm --auto-req disabled -o "AMR-${VERSION}-1.x86_64.rpm"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            AMR-*-x86_64.AppImage
            AMR_*_amd64.deb
            AMR-*-1.x86_64.rpm

  build-linux-arm64:
    name: Build Linux ARM64 (aarch64)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build AMR ARM64 Release
        run: cargo build --release --bin amr

      - name: Package Linux ARM64 (AppImage, DEB, RPM)
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}"
          echo "Packaging Linux ARM64 releases for version $VERSION"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage -O appimagetool || true
          if [ -f appimagetool ]; then
            chmod +x appimagetool
            ./appimagetool --appimage-extract || true
          fi
          ./packaging/linux/build_appimage.sh "$VERSION" "aarch64"
          if [ -d squashfs-root ]; then
            ARCH=aarch64 ./squashfs-root/AppRun --no-appstream target/AppDir "AMR-${VERSION}-aarch64.AppImage"
          fi
          ./packaging/linux/build_deb.sh "$VERSION" "arm64"
          cargo install cargo-generate-rpm --locked || true
          cargo-generate-rpm --auto-req disabled -o "AMR-${VERSION}-1.aarch64.rpm" || true

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: |
            AMR-*-aarch64.AppImage
            AMR_*_arm64.deb
            AMR-*-1.aarch64.rpm

  build-windows:
    name: Build Windows Portable EXE (x86_64 & arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Build AMR x86_64
        run: cargo build --release --target x86_64-pc-windows-msvc --bin amr

      - name: Build AMR ARM64
        continue-on-error: true
        run: cargo build --release --target aarch64-pc-windows-msvc --bin amr

      - name: Rename to standard release format
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}"
          echo "Packaging Windows EXEs for version $VERSION"
          cp target/x86_64-pc-windows-msvc/release/amr.exe "AMR-${VERSION}-x86_64.exe"
          if [ -f target/aarch64-pc-windows-msvc/release/amr.exe ]; then
            cp target/aarch64-pc-windows-msvc/release/amr.exe "AMR-${VERSION}-arm64.exe"
          fi

      - name: Upload Windows Portable EXEs
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            AMR-*-x86_64.exe
            AMR-*-arm64.exe

  create-release:
    name: Publish GitHub Release (AppImage, DEB, RPM, EXE)
    needs: [build-linux, build-linux-arm64, build-windows]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist files
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AMR ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
          body: |
            ## AMR (Antigravity Manager Rust) ${{ github.ref_name }}

            ### Release Highlights & What's Changed
            - **Google Antigravity Upstream Fix**: Resolved `404 Not Found (Requested entity was not found)` by mapping image generation requests to `gemini-3.1-flash-image` (with `image-generator` & `dall-e-3` aliases).
            - **OpenAI Model Compliance**: Standardized all broadcast models to OpenAI-compliant lower-case identifiers.
            - **OpenAI Audio STT (`/v1/audio/transcriptions`)**: Full Whisper API compatibility for multipart audio transcription via Gemini Pa upstream.
            - **OpenAI Audio TTS (`/v1/audio/speech`) & Audio Models**: Added audio speech synthesis endpoint and cataloged `whisper-1` & `tts-1` models.
            - **Dynamic Automated Packaging**: Standalone release packages dynamically bound to project versioning.

            ### Standalone Packages (x86_64 & ARM64):
            - **Linux AppImage:** `AMR-*-x86_64.AppImage` & `AMR-*-aarch64.AppImage` (Portable binary for Linux)
            - **Debian / Ubuntu DEB:** `AMR_*_amd64.deb` & `AMR_*_arm64.deb`
            - **Fedora / RHEL RPM:** `AMR-*-1.x86_64.rpm` & `AMR-*-1.aarch64.rpm`
            - **Windows Portable EXE:** `AMR-*-x86_64.exe` & `AMR-*-arm64.exe` (Standalone single-file executable)

