name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Aroxy Release
        run: cargo build --release --bin aroxy

      - name: Package AppImage
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./packaging/linux/build_appimage.sh
          ./appimagetool target/AppDir Aroxy-0.0.1-x86_64.AppImage || cp target/release/aroxy Aroxy-0.0.1-x86_64.AppImage

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Aroxy-0.0.1-x86_64.AppImage
          path: Aroxy-0.0.1-x86_64.AppImage

  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Aroxy Portable EXE
        run: cargo build --release --bin aroxy

      - name: Rename to standard release format
        shell: bash
        run: cp target/release/aroxy.exe Aroxy-0.0.1-x86_64.exe

      - name: Upload Windows Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Aroxy-0.0.1-x86_64.exe
          path: Aroxy-0.0.1-x86_64.exe

  create-release:
    name: Publish GitHub Release (AppImage + EXE)
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist files
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aroxy v0.0.1
          tag_name: ${{ github.ref_name }}
          files: |
            dist/Aroxy-0.0.1-x86_64.AppImage
            dist/Aroxy-0.0.1-x86_64.exe
          draft: false
          prerelease: false
          body: |
            ## Aroxy v0.0.1

            Ultra-lightweight high-performance AI protocol proxy & emulator in Rust + Slint.

            ### Release Binaries:
            - **Linux:** `Aroxy-0.0.1-x86_64.AppImage` (Portable AppImage)
            - **Windows:** `Aroxy-0.0.1-x86_64.exe` (Standalone Portable Executable)
