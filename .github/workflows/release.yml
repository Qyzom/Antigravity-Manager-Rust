name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev cmake clang libclang-dev perl nasm

      - name: Build AMR Release
        run: cargo build --release --bin amr

      - name: Package AppImage, DEB and RPM
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}"
          echo "Packaging Linux releases for version $VERSION"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ./packaging/linux/build_appimage.sh "$VERSION" "x86_64"
          ARCH=x86_64 ./squashfs-root/AppRun --no-appstream target/AppDir "AMR-${VERSION}-x86_64.AppImage"
          ./packaging/linux/build_deb.sh "$VERSION" "amd64"
          cargo install cargo-generate-rpm --locked
          cargo-generate-rpm --auto-req disabled -o "AMR-${VERSION}-1.x86_64.rpm"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            AMR-*-x86_64.AppImage
            AMR_*_amd64.deb
            AMR-*-1.x86_64.rpm

  build-linux-arm64:
    name: Build Linux ARM64 (aarch64)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev cmake clang libclang-dev perl nasm

      - name: Build AMR ARM64 Release
        run: cargo build --release --bin amr

      - name: Package Linux ARM64 (AppImage, DEB, RPM)
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}"
          echo "Packaging Linux ARM64 releases for version $VERSION"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage -O appimagetool || true
          if [ -f appimagetool ]; then
            chmod +x appimagetool
            ./appimagetool --appimage-extract || true
          fi
          ./packaging/linux/build_appimage.sh "$VERSION" "aarch64"
          if [ -d squashfs-root ]; then
            ARCH=aarch64 ./squashfs-root/AppRun --no-appstream target/AppDir "AMR-${VERSION}-aarch64.AppImage"
          fi
          ./packaging/linux/build_deb.sh "$VERSION" "arm64"
          cargo install cargo-generate-rpm --locked || true
          cargo-generate-rpm --auto-req disabled -o "AMR-${VERSION}-1.aarch64.rpm" || true

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: |
            AMR-*-aarch64.AppImage
            AMR_*_arm64.deb
            AMR-*-1.aarch64.rpm

  build-windows:
    name: Build Windows Portable EXE (x86_64 & arm64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - name: Install Windows BoringSSL build dependencies
        shell: pwsh
        run: |
          choco install nasm ninja -y --no-progress
          echo "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          if (Test-Path "C:\Strawberry\perl\bin") {
            echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          echo "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path "C:\Program Files\LLVM\bin") {
            echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Setup MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build AMR x86_64
        shell: pwsh
        run: cargo build --release --target x86_64-pc-windows-msvc --bin amr

      - name: Setup MSVC ARM64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Build AMR ARM64
        continue-on-error: true
        run: cargo build --release --target aarch64-pc-windows-msvc --bin amr

      - name: Rename to standard release format
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)}"
          echo "Packaging Windows EXEs for version $VERSION"
          cp target/x86_64-pc-windows-msvc/release/amr.exe "AMR-${VERSION}-x86_64.exe"
          if [ -f target/aarch64-pc-windows-msvc/release/amr.exe ]; then
            cp target/aarch64-pc-windows-msvc/release/amr.exe "AMR-${VERSION}-arm64.exe"
          fi

      - name: Upload Windows Portable EXEs
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            AMR-*-x86_64.exe
            AMR-*-arm64.exe

  create-release:
    name: Publish GitHub Release (AppImage, DEB, RPM, EXE)
    needs: [build-linux, build-linux-arm64, build-windows]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist files
        run: ls -la dist/

      - name: Generate Release Body from Metadata
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="${TAG#v}"
          python3 - "$TAG" "$VER" << 'PYEOF' > release_body.md
          import sys

          tag, ver = sys.argv[1], sys.argv[2]
          with open("AGENTS.md", "r", encoding="utf-8") as f:
              text = f.read()

          lines = text.splitlines()
          in_ver = False
          ver_lines = []
          for line in lines:
              if line.startswith(f"- **v{ver}"):
                  in_ver = True
                  continue
              if in_ver:
                  if line.startswith("- **v") or line.startswith("## "):
                      break
                  if line.strip():
                      ver_lines.append(line[2:] if line.startswith("  ") else line)

          print(f"## AMR (Antigravity Manager Rust) {tag}\n")
          if ver_lines:
              print("### Release Highlights & What's Changed\n")
              for l in ver_lines:
                  print(l)
              print()

          base_dl = f"https://github.com/Qyzom/Antigravity-Manager-Rust/releases/download/{tag}"

          print("### 📦 Downloads\n")
          print("#### 🐧 DEB (Ubuntu / Debian / Mint)")
          print(f"- **x86_64:** [`AMR_{ver}_amd64.deb`]({base_dl}/AMR_{ver}_amd64.deb)")
          print(f"- **ARM64:** [`AMR_{ver}_arm64.deb`]({base_dl}/AMR_{ver}_arm64.deb)\n")

          print("#### 🐧 RPM (Fedora / RHEL / openSUSE)")
          print(f"- **x86_64:** [`AMR-{ver}-1.x86_64.rpm`]({base_dl}/AMR-{ver}-1.x86_64.rpm)")
          print(f"- **ARM64:** [`AMR-{ver}-1.aarch64.rpm`]({base_dl}/AMR-{ver}-1.aarch64.rpm)\n")

          print("#### 🐧 AppImage (Universal Portable Linux)")
          print(f"- **x86_64:** [`AMR-{ver}-x86_64.AppImage`]({base_dl}/AMR-{ver}-x86_64.AppImage)")
          print(f"- **ARM64:** [`AMR-{ver}-aarch64.AppImage`]({base_dl}/AMR-{ver}-aarch64.AppImage)\n")

          print("#### 🪟 Windows Portable EXE")
          print(f"- **x86_64:** [`AMR-{ver}-x86_64.exe`]({base_dl}/AMR-{ver}-x86_64.exe)")
          print(f"- **ARM64:** [`AMR-{ver}-arm64.exe`]({base_dl}/AMR-{ver}-arm64.exe)\n")
          PYEOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AMR ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
          body_path: release_body.md

