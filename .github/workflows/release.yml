name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build AMR Release
        run: cargo build --release --bin amr

      - name: Package AppImage, DEB and RPM
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-0.1.3}"
          echo "Packaging Linux releases for version $VERSION"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./packaging/linux/build_appimage.sh "$VERSION"
          ./appimagetool target/AppDir "AMR-${VERSION}-x86_64.AppImage" || cp target/release/amr "AMR-${VERSION}-x86_64.AppImage"
          ./packaging/linux/build_deb.sh "$VERSION"
          cargo install cargo-generate-rpm --locked
          cargo-generate-rpm --auto-req disabled -o "AMR-${VERSION}-1.x86_64.rpm"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            AMR-*-x86_64.AppImage
            AMR_*_amd64.deb
            AMR-*-1.x86_64.rpm

  build-linux-arm64:
    name: Build Linux ARM64 (aarch64)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build AMR ARM64 Release
        run: cargo build --release --bin amr

      - name: Package Linux ARM64 (DEB, RPM, Binary)
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-0.1.3}"
          echo "Packaging Linux ARM64 releases for version $VERSION"
          cp target/release/amr "AMR-${VERSION}-aarch64"
          ./packaging/linux/build_deb.sh "$VERSION" "arm64"
          cargo install cargo-generate-rpm --locked || true
          cargo-generate-rpm --auto-req disabled -o "AMR-${VERSION}-1.aarch64.rpm" || true

      - name: Upload Linux ARM64 Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifacts
          path: |
            AMR-*-aarch64
            AMR_*_arm64.deb
            AMR-*-1.aarch64.rpm

  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build AMR Portable EXE
        run: cargo build --release --bin amr

      - name: Rename to standard release format
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-0.1.3}"
          echo "Packaging Windows EXE for version $VERSION"
          cp target/release/amr.exe "AMR-${VERSION}-x86_64.exe"

      - name: Upload Windows Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: AMR-*-x86_64.exe

  create-release:
    name: Publish GitHub Release (AppImage, DEB, RPM, EXE)
    needs: [build-linux, build-windows]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist files
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: AMR ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
          body: |
            ## AMR (Antigravity Manager Rust) ${{ github.ref_name }}

            Ultra-lightweight high-performance AI API proxy, protocol emulator & multi-account quota dispatcher in pure Rust.

            ### Release Packages (x86_64 & ARM64):
            - **Linux AppImage:** `AMR-*-x86_64.AppImage` (Portable package for any modern Linux)
            - **Debian / Ubuntu DEB:** `AMR_*_amd64.deb` & `AMR_*_arm64.deb`
            - **Fedora / RHEL RPM:** `AMR-*-1.x86_64.rpm` & `AMR-*-1.aarch64.rpm`
            - **Windows Portable EXE:** `AMR-*-x86_64.exe` & `AMR-*-arm64.exe` (Standalone executables)

