name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Aroxy Release
        run: cargo build --release --bin aroxy

      - name: Package AppImage
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-0.0.2}"
          echo "Packaging Linux AppImage for version $VERSION"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./packaging/linux/build_appimage.sh "$VERSION"
          ./appimagetool target/AppDir "Aroxy-${VERSION}-x86_64.AppImage" || cp target/release/aroxy "Aroxy-${VERSION}-x86_64.AppImage"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: Aroxy-*-x86_64.AppImage

  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Aroxy Portable EXE
        run: cargo build --release --bin aroxy

      - name: Rename to standard release format
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-0.0.2}"
          echo "Packaging Windows EXE for version $VERSION"
          cp target/release/aroxy.exe "Aroxy-${VERSION}-x86_64.exe"

      - name: Upload Windows Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: Aroxy-*-x86_64.exe

  create-release:
    name: Publish GitHub Release (AppImage + EXE)
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist files
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aroxy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
          body: |
            ## Aroxy ${{ github.ref_name }}

            Ultra-lightweight high-performance AI API proxy & emulator for Antigravity supporting OpenAI, Claude & Gemini protocols. Pure Rust + Slint.

            ### What's New in v0.0.2:
            - **Complete UI Redesign:** Dark minimalist workstation design system with smooth vertical `ScrollView` on all tabs.
            - **7-Tab Architecture:**
              - **Dashboard:** Aggregate quota gauge, live status, and 1-click client snippets.
              - **Accounts:** Browser OAuth loopback callback (`/oauth/callback`) & manual token ingestion with real-time quota telemetry and reset countdowns.
              - **Models & Playground:** Full Antigravity catalog with `[Free]`, `[Pro]`, `[Thinking]` tiers, broadcast toggles, reasoning clone switches, and live interactive prompt tester with debug telemetry.
              - **Proxy Layer ("Прослойка"):** Smart Quota-Aware, Round-Robin, and Failover routing strategies with active endpoint monitors.
              - **Traffic Logs:** Real-time stream and batch inspector with token and latency tracking.
              - **Statistics:** Granular breakdown of prompt, completion, and reasoning tokens, plus latency percentiles.
              - **Settings:** Tray daemon toggles, autostart, portable mode (`aroxy.json`), and network timeouts.
            - **License:** Official permissive MIT License.

            ### Release Binaries:
            - **Linux:** `Aroxy-0.0.2-x86_64.AppImage` (Standalone Portable AppImage)
            - **Windows:** `Aroxy-0.0.2-x86_64.exe` (Standalone Portable Executable)
