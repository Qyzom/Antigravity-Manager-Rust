name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev

      - name: Build Aroxy Release
        run: cargo build --release --bin aroxy

      - name: Package AppImage
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-0.0.3}"
          echo "Packaging Linux AppImage for version $VERSION"
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./packaging/linux/build_appimage.sh "$VERSION"
          ./appimagetool target/AppDir "Aroxy-${VERSION}-x86_64.AppImage" || cp target/release/aroxy "Aroxy-${VERSION}-x86_64.AppImage"

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: Aroxy-*-x86_64.AppImage

  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Aroxy Portable EXE
        run: cargo build --release --bin aroxy

      - name: Rename to standard release format
        shell: bash
        run: |
          RAW_VER="${GITHUB_REF_NAME#v}"
          VERSION="${RAW_VER:-0.0.3}"
          echo "Packaging Windows EXE for version $VERSION"
          cp target/release/aroxy.exe "Aroxy-${VERSION}-x86_64.exe"

      - name: Upload Windows Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: Aroxy-*-x86_64.exe

  create-release:
    name: Publish GitHub Release (AppImage + EXE)
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List dist files
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Aroxy ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: dist/*
          draft: false
          prerelease: false
          body: |
            ## Aroxy ${{ github.ref_name }}

            Ultra-lightweight high-performance AI API proxy & emulator for Antigravity supporting OpenAI, Claude & Gemini protocols. Pure Rust + Slint.

            ### What's New in v0.0.3:
            - **Google OAuth 2.0 Web Flow & Token Keeper:**
              - Built-in OAuth 2.0 loopback callback handler (`/oauth/callback`) with official Antigravity Client ID / Secret.
              - Permanent `refresh_token` storage and automatic token refresh 5 minutes prior to expiration (no more expired token 401s).
            - **Hardware Fingerprint & Device Isolation:**
              - Isolated `DeviceProfile` per upstream account (`X-Client-Id`, `X-Machine-Id`, `gl-rust/1.0.0`, Hub UA `antigravity/hub/2.23.1`).
            - **Per-Account Proxy Support:**
              - Dynamic connection pool with individual HTTP / HTTPS / SOCKS5 proxy routing per account to avoid IP clustering.
            - **RustCooling i18n Architecture:**
              - Modern JSON-based localization (`i18n/ru.json`, `i18n/en.json`, `i18n/zh.json`).
            - **UI Refinements:**
              - Account details expanded modal, improved token statistics, zero-bloat.

            ### Release Binaries:
            - **Linux:** `Aroxy-0.0.3-x86_64.AppImage` (Standalone Portable AppImage)
            - **Windows:** `Aroxy-0.0.3-x86_64.exe` (Standalone Portable Executable)
