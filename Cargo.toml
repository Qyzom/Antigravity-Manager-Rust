[package]
name = "amr"
version = "0.1.5"
edition = "2021"
authors = ["Qyzom <t0lotsmail@gmail.com>"]
description = "Ultra-lightweight high-performance AI API proxy & protocol emulator in Rust (Antigravity Manager Rust)"
license = "MIT"
repository = "https://github.com/Qyzom/Antigravity-Manager-Rust"

[dependencies]
# GUI
slint = { version = "1.9", default-features = false, features = ["backend-winit", "renderer-femtovg", "compat-1-2"] }
i-slint-backend-winit = { version = "1.9", default-features = false }

# Async runtime & HTTP Server
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "json", "query", "macros", "multipart"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "socks", "multipart"] }
bytes = "1"
futures-util = "0.3"
async-stream = "0.3"
parking_lot = "0.12"

# Serialization & utils
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
dirs = "6.0"
clap = { version = "4.5", features = ["derive"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.10", features = ["v4"] }
fastrand = "2.3"


# System Tray
tray-icon = { version = "0.19", default-features = false }
muda = { version = "0.15", default-features = false }
arboard = "3.7.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }


[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
auto-launch = "0.5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[build-dependencies]
slint-build = "1.9"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }


[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/amr", dest = "/usr/bin/amr", mode = "755" },
    { source = "packaging/linux/amr.desktop", dest = "/usr/share/applications/amr.desktop", mode = "644" },
    { source = "assets/icons/logo_256.png", dest = "/usr/share/icons/hicolor/256x256/apps/amr.png", mode = "644" },
]

strip = "symbols"
